plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// release 签名：通过环境变量提供，防止密钥入库。
// 未提供时 release 构建自动降级为 debug 签名，保证开源仓库可开箱构建。
def sgKeystore = System.getenv("SAFEGUARD_KEYSTORE")
def sgStorePass = System.getenv("SAFEGUARD_KEYSTORE_PASS")
def sgKeyAlias = System.getenv("SAFEGUARD_KEY_ALIAS")
def sgKeyPass = System.getenv("SAFEGUARD_KEY_PASS")
def hasReleaseSigning = sgKeystore && file(sgKeystore).exists()

android {
    namespace 'com.safeguard.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.safeguard.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(sgKeystore)
                storePassword sgStorePass
                keyAlias sgKeyAlias
                keyPassword sgKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.6.1'
}
